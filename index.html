<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reise">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Reisebegleiter</title>
<style>
:root{--bg:#f3f4fb;--card:#fff;--tx:#14162b;--mu:#6c7089;--ac:#5b5bf0;--ln:#e8e9f3;--ok:#22a06b;--dg:#e5484d;--sh:0 4px 18px rgba(30,30,80,.08);box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#0d0e17;--card:#171926;--tx:#f1f2f8;--mu:#9a9db5;--ln:#262938;--sh:0 4px 18px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
input,textarea,button{font:inherit;color:var(--tx)}
input,textarea{width:100%;padding:12px;border:1px solid var(--ln);border-radius:12px;background:var(--card)}
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#06b6d4);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 34px;border-radius:0 0 30px 30px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:.85;letter-spacing:.6px;text-transform:uppercase}
.top button{background:rgba(255,255,255,.2);border:0;border-radius:50%;width:36px;height:36px;font-size:17px}
.hero h1{margin:10px 0 2px;font-size:28px}
.cd{display:flex;align-items:baseline;gap:8px}.cd b{font-size:44px;line-height:1}.cd span{opacity:.9}
main{padding:0 16px;margin-top:-18px}
.card{background:var(--card);border-radius:18px;padding:14px;margin:12px 0;box-shadow:var(--sh)}
.it{display:flex;gap:12px;align-items:flex-start}
.ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}
.it h3{margin:0;font-size:17px}.m{color:var(--mu);font-size:14px}
.body{flex:1;min-width:0}
.ref{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:9px;background:var(--bg);font:700 14px ui-monospace,Menlo,monospace;letter-spacing:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--bg);border-radius:20px;padding:5px 11px;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:600;text-align:center;display:block}
.btn.g{background:var(--card);color:var(--tx);box-shadow:var(--sh)}.btn.d{background:var(--dg)}
.gap{margin-top:10px;width:100%}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats div{background:var(--card);border-radius:16px;padding:12px 4px;text-align:center;box-shadow:var(--sh);font-size:12px;color:var(--mu)}
.stats b{display:block;font-size:22px;color:var(--tx)}
h2.s{font-size:15px;margin:18px 4px 0;color:var(--mu);text-transform:uppercase;letter-spacing:.5px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);box-shadow:0 -4px 20px rgba(0,0,0,.08);padding-bottom:env(safe-area-inset-bottom,0px);z-index:3}
nav button{flex:1;background:none;border:0;padding:9px 0 8px;font-size:10.5px;color:var(--mu)}
nav button span{display:block;font-size:21px}nav button.on{color:var(--ac);font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:5}.sheet.show{display:flex}
.sheet>div{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.sheet label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
.row{display:flex;gap:8px;margin-top:14px}.row .btn{flex:1}
.fr{display:flex;justify-content:space-between;gap:8px;background:var(--card);border-radius:12px;padding:10px 12px;margin-top:6px}
.fr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fr i{font-style:normal;color:var(--mu)}
.full{position:fixed;inset:0;background:#fff;z-index:9;display:none;flex-direction:column}.full.show{display:flex}
.tb{display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;background:#111}
.tb button{background:#333;color:#fff;border:0;border-radius:20px;padding:8px 14px}
#fv{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#111;text-align:center;padding:10px}
#fv img{max-width:100%;max-height:100%}#fv iframe{width:100%;flex:1;border:0}
.pk{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--ln)}
.pk input{width:24px;height:24px;flex:none;accent-color:var(--ok)}
.pk.done span{text-decoration:line-through;color:var(--mu)}.pk span{flex:1}.pk i{font-style:normal;color:var(--mu);padding:4px 8px}
.bar{height:9px;background:var(--ln);border-radius:6px;overflow:hidden;margin:8px 0 2px}.bar div{height:100%;background:linear-gradient(90deg,#22a06b,#06b6d4);transition:width .3s}
.busy,.toast{position:fixed;z-index:10;left:50%;transform:translateX(-50%);background:#111;color:#fff;border-radius:16px;padding:14px 20px;display:none;text-align:center;max-width:88%}
.busy{top:42%}.toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}.busy.show,.toast.show{display:block}
select{width:100%;padding:12px;border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx);font:inherit}
.pill{display:inline-block;margin-top:12px;padding:5px 12px;border-radius:20px;font-size:12px;background:rgba(255,255,255,.2)}.pill.warn{background:#f59e0b;color:#222}.pill:empty{display:none}
.lock{position:fixed;inset:0;z-index:20;background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#06b6d4);color:#fff;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}.lock.show{display:flex}
.lock input{text-align:center;font-size:28px;letter-spacing:12px;margin:14px auto;width:200px;color:#14162b;background:#fff}.lock .btn{background:rgba(255,255,255,.2);color:#fff;box-shadow:none;margin:12px auto 0}
.cols{display:flex;gap:6px;align-items:flex-end;min-height:110px}.cols>div{flex:1;text-align:center;font-size:10px;color:var(--mu)}.cols i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(#7c3aed,#4f46e5);margin-bottom:4px}
.cap{color:#111;font-size:20px;line-height:1.35}.cap b{font:700 30px ui-monospace,Menlo,monospace;letter-spacing:3px}
.fl{display:flex;align-items:center;gap:10px;margin-top:6px}.fl small{display:block;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.4px}.fl b{font-size:15px}.fl .ar{color:var(--mu)}
.gap2{position:relative;margin:-4px 16px;padding:7px 12px;border-radius:12px;background:#5b5bf018;color:var(--ac);font-size:13px;font-weight:600;text-align:center}.gap2.warn{background:#f59e0b2a;color:#b45309}.gap2.bad{background:#e5484d22;color:var(--dg)}
</style>
</head>
<body>
<div class="hero"><div class="top"><span>Reisebegleiter</span><button onclick="settings()">⚙️</button></div>
<h1 id="tn"></h1><div class="cd"><b id="cdn"></b><span id="cdl"></span></div><div class="pill" id="off"></div></div>
<main id="main"></main>
<nav id="nav"></nav>
<div class="sheet" id="sheet"><div id="form"></div></div>
<div class="full" id="full"><div class="tb"><button onclick="shareCur()">Teilen / Öffnen in …</button><button onclick="closeFull()">Schließen</button></div><div id="fv"></div></div>
<div class="lock" id="lock"><div><h2 style="margin:0">🔒 Reisebegleiter</h2><input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" oninput="chkPin()"><div id="pe"></div><button class="btn" onclick="wipe()">PIN vergessen?</button></div></div><div class="busy" id="busy"></div><div class="toast" id="toast"></div>
<script src="parse.js"></script>
<script>
const TABS=[
{k:'home',n:'Übersicht',e:'🏠'},
{k:'flights',n:'Flüge',e:'✈️',t:'Flug',c:'#3b82f6',f:{title:'Flug (z. B. EK 413 FRA → DXB)',date0:'Check-in / Boarding ab',date:'Abflug (Ortszeit)',date2:'Ankunft (Ortszeit)',ref:'Buchungscode',note:'Sitz, Gate, Terminal …'}},
{k:'hotels',n:'Hotels',e:'🏨',t:'Hotel',c:'#f59e0b',dateOnly:1,f:{title:'Hotelname',date:'Check-in',date2:'Check-out',ref:'Buchungsnummer',note:'Adresse, Hinweise …'}},
{k:'visa',n:'Visa',e:'🛂',t:'Visum',c:'#10b981',dateOnly:1,f:{title:'Land / Visum-Art',date:'Gültig ab',date2:'Gültig bis',ref:'Antrags- / Visumsnummer',note:'Notizen'}},
{k:'pack',n:'Packliste',e:'🎒'},{k:'exp',n:'Ausgaben',e:'💶'}];
const K=['flights','hotels','visa'];
const DEF=['Reisepass','Visum / ETA','Flugtickets','Kreditkarte & Bargeld','Handy & Ladekabel','Powerbank','Reiseadapter','Medikamente','Kopfhörer','Sonnencreme','Hygieneartikel','Kleidung','Auslandskrankenversicherung'];
let S;try{S=JSON.parse(localStorage.getItem('reise')||'null')}catch(e){}
S=S||{trip:{name:'Meine Reise',date:''},flights:[],hotels:[],visa:[],pack:[]};
const norm=()=>{S.exp=S.exp||[];S.people=S.people&&S.people.length?S.people:['Ich'];S.trip.cur=S.trip.cur||'€';S.trip.budget=S.trip.budget||0;S.trip.home=S.trip.home||'€';S.trip.rate=S.trip.rate||0;S.emg=S.emg||[]};norm();
let tab='home';
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function save(){try{localStorage.setItem('reise',JSON.stringify(S))}catch(e){alert('Speicher voll.')}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),4000)}
function busy(m){const b=$('busy');b.textContent=m||'';b.classList.toggle('show',!!m)}
function fmt(v,d){if(!v)return'';const x=new Date(v);if(isNaN(x))return v;return d?x.toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric'}):x.toLocaleString('de-DE',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
/* Dateispeicher (IndexedDB) */
const DB=new Promise((ok,no)=>{const r=indexedDB.open('reise-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=(m,fn)=>DB.then(d=>new Promise((ok,no)=>{const t=d.transaction('f',m),q=fn(t.objectStore('f'));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)}));
const putF=o=>tx('readwrite',s=>s.put(o)),getF=id=>tx('readonly',s=>s.get(id)),delF=id=>tx('readwrite',s=>s.delete(id));
const refs=id=>K.reduce((a,k)=>a+S[k].filter(i=>(i.files||[]).some(f=>f.id===id)).length,0);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
(async()=>{let ch=0;for(const k of K)for(const i of S[k]){i.files=i.files||[];if(i.img){try{const b=await(await fetch(i.img)).blob(),id=uid();await putF({id,name:'Foto.jpg',type:'image/jpeg',blob:b});i.files.push({id,name:'Foto.jpg',type:'image/jpeg'})}catch(e){}delete i.img;ch=1}}if(ch){save();render()}})();
function shrink(f,max,q){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(new Error('Bild nicht lesbar')),'image/jpeg',q)};im.onerror=()=>no(new Error('Bild nicht lesbar'));im.src=u})}
async function saveFile(f){let blob=f,type=f.type||'application/octet-stream',name=f.name||'Datei';if(type.startsWith('image/')){blob=await shrink(f,1600,.8);type='image/jpeg'}const id=uid();await putF({id,name,type,blob});return{id,name,type}}
const ico=f=>f.type.startsWith('image/')?'🖼️':f.type==='application/pdf'?'📕':'📄';
let vid='',vurl='';
async function openFile(id,cap){const f=await getF(id);if(!f)return alert('Datei nicht gefunden');vid=id;vurl=URL.createObjectURL(f.blob);
 $('fv').innerHTML=(cap?'<div class="cap">'+cap+'</div>':'')+(f.type.startsWith('image/')?`<img src="${vurl}" alt="">`:f.type==='application/pdf'?`<iframe src="${vurl}"></iframe>`:'<p>Keine Vorschau möglich.<br>Tippe oben auf „Teilen / Öffnen in …“.</p>');$('full').classList.add('show')}
function closeFull(){$('full').classList.remove('show');$('fv').innerHTML='';vurl&&URL.revokeObjectURL(vurl)}
async function shareCur(){try{const f=await getF(vid);await navigator.share({files:[new File([f.blob],f.name,{type:f.type})]})}catch(e){}}
/* Auslesen mit Claude */
const PROMPT='Lies dieses Reisedokument. Antworte NUR mit JSON: {"items":[{"kind":"flights|hotels|visa","title":"","date":"","date2":"","ref":"","note":""}]}. flights: ein Eintrag je Flugsegment, title="Flugnummer Abflug → Ziel" (IATA-Codes), date=Abflug, date2=Ankunft (Format YYYY-MM-DDTHH:MM, Ortszeit), ref=Buchungscode, note=Passagier, Sitz, Gate, Terminal. hotels: title=Hotelname, date=Check-in, date2=Check-out (YYYY-MM-DD), ref=Buchungsnummer, note=Adresse. visa: title=Land und Visumart, date=gültig ab, date2=gültig bis (YYYY-MM-DD), ref=Nummer, note=Details. Unbekanntes leer lassen, nichts erfinden.';
const b64=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.readAsDataURL(b)});
async function ai(f){const key=localStorage.getItem('rk');if(!key){settings();throw new Error('Bitte zuerst deinen API-Schlüssel in den Einstellungen eintragen.')}
 let type=f.type,blob=f;if(type.startsWith('image/')){blob=await shrink(f,1800,.85);type='image/jpeg'}else if(type!=='application/pdf')throw new Error('Auslesen geht nur mit Fotos und PDFs. Andere Dateien kannst du im Eintrag anhängen.');
 const d=await b64(blob),blk={type:type==='application/pdf'?'document':'image',source:{type:'base64',media_type:type,data:d}};
 const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:localStorage.getItem('rm')||'claude-sonnet-5-5',max_tokens:2000,messages:[{role:'user',content:[blk,{type:'text',text:PROMPT}]}]})});
 const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||'Fehler '+r.status);
 const m=j.content.map(c=>c.text||'').join('').match(/\{[\s\S]*\}/);if(!m)throw new Error('Keine Daten erkannt.');return JSON.parse(m[0]).items||[]}
const nd=(v,t)=>!v?'':t.dateOnly?String(v).slice(0,10):String(v).length===10?v+'T00:00':String(v).slice(0,16);
const sortL=k=>S[k].sort((a,b)=>(a.date||'9').localeCompare(b.date||'9'));
let pf=null;
const LIBS={pdf:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',ocr:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'},WORKER='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js',loaded={};
function lib(k){return loaded[k]||(loaded[k]=new Promise((ok,no)=>{const s=document.createElement('script');s.src=LIBS[k];s.crossOrigin='anonymous';s.onload=ok;s.onerror=()=>{delete loaded[k];no(new Error('Die Auslese-Komponente konnte nicht geladen werden. Beim ersten Mal wird Internet gebraucht.'))};document.head.appendChild(s)}))}
async function pdfText(f){await lib('pdf');if(!pdfjsLib.GlobalWorkerOptions.workerSrc){const w=await(await fetch(WORKER)).blob();pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([w],{type:'text/javascript'}))}
 const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t='';
 for(let i=1;i<=Math.min(d.numPages,12);i++){const c=await(await d.getPage(i)).getTextContent();let y=null,l='';c.items.forEach(it=>{const yy=it.transform[5];if(y!==null&&Math.abs(yy-y)>3){t+=l+'\n';l=''}l+=it.str+' ';y=yy});t+=l+'\n'}
 if(t.replace(/\s/g,'').length<20)throw new Error('Im PDF steckt kein lesbarer Text (gescannt?). Mach einen Screenshot davon und lies ihn als Foto ein.');return t}
async function ocrText(f){if(!localStorage.rocr&&!confirm('Für Fotos wird einmalig eine Texterkennung geladen (ca. 20 MB, braucht Internet). Danach läuft sie lokal auf dem iPhone. Jetzt laden?'))return null;
 busy('Texterkennung wird geladen und ausgeführt …');await lib('ocr');const w=await Tesseract.createWorker('deu+eng');try{const r=(await w.recognize(await shrink(f,2400,.9))).data.text;localStorage.rocr=1;return r}finally{await w.terminate()}}
async function getText(f){const t=f.type;if(t==='application/pdf')return pdfText(f);if(t.startsWith('image/'))return ocrText(f);if(t.startsWith('text/'))return f.text();throw new Error('Dieses Dateiformat kann nicht ausgelesen werden. Hänge es im Eintrag manuell an.')}
function importSheet(txt){$('form').innerHTML=`<h2 style="margin:0">Dokument einlesen</h2><p class="m">${localStorage.rengine==='claude'?'Methode: Claude online (Dateien werden an Anthropic gesendet).':'Methode: lokal auf dem iPhone – nichts wird gesendet.'}</p>
 <label class="btn gap" for="imp">📄 PDF oder Foto wählen</label><input id="imp" type="file" accept="image/*,application/pdf,text/plain" hidden onchange="importDoc(this)">
 <label>Oder Text einfügen (z. B. aus der Bestätigungs-Mail; in Fotos: Text markieren → Kopieren)</label><textarea id="imp_t" rows="7">${esc(txt||'')}</textarea>${pf?`<p class="m">Wird angehängt: ${esc(pf.name)}</p>`:''}
 <div class="row"><button class="btn g" onclick="pf=null;closeForm()">Abbrechen</button><button class="btn" onclick="runText()">Text auslesen</button></div>`;$('sheet').classList.add('show')}
async function importDoc(inp){const f=inp.files[0];inp.value='';if(!f)return;pf=f;closeForm();await run(f,null)}
async function runText(){const t=$('imp_t').value.trim();if(!t)return alert('Bitte erst Text einfügen.');closeForm();await run(pf,t)}
async function run(f,text){busy('Wird ausgelesen …');
 try{let items,src=text;
  if(localStorage.rengine==='claude'&&f&&text==null)items=await ai(f);
  else{if(src==null){src=await getText(f);if(src===null){busy();importSheet();toast('Tipp: Text im Foto markieren → Kopieren → hier einfügen');return}}items=parseDoc(src)}
  if(!items.length){busy();importSheet(src||'');alert('Keine Reisedaten erkannt. Prüf den Text unten, korrigiere ihn oder füge ihn aus der Quelle ein.');return}
  const fm=f?await saveFile(f):null;let first;
  items.forEach(o=>{const k=K.includes(o.kind)?o.kind:'flights',t=TABS.find(x=>x.k===k),it={id:uid(),title:o.title||'Ohne Titel',date0:nd(o.date0,t),date:nd(o.date,t),date2:nd(o.date2,t),ref:o.ref||'',note:o.note||'',files:fm?[fm]:[]},dup=S[k].find(x=>x.title===it.title&&x.date===it.date);
   if(dup){Object.assign(dup,{date0:it.date0||dup.date0,date2:it.date2||dup.date2,ref:it.ref||dup.ref,note:it.note||dup.note});if(fm&&!(dup.files||[]).some(f=>f.id===fm.id))(dup.files=dup.files||[]).push(fm);first=first||[k,dup.id]}else{S[k].push(it);first=first||[k,it.id]}});
  K.forEach(sortL);save();pf=null;busy();tab=first[0];render();toast(items.length+' Eintrag/Einträge angelegt – bitte kurz prüfen');openForm(first[0],first[1])}
 catch(e){busy();alert(e.message)}}
const impBtn=()=>`<button class="btn g gap" onclick="importSheet()">📄 Aus Dokument / Foto einlesen</button>`;
/* Anzeige */
function head(){$('tn').textContent=S.trip.name||'Meine Reise';const sd=S.trip.date||((S.flights[0]||{}).date||'').slice(0,10),d=sd?Math.ceil((new Date(sd)-new Date().setHours(0,0,0,0))/864e5):null;
 $('cdn').textContent=d===null?'–':d>0?d:d===0?'🎉':'✓';$('cdl').textContent=d===null?'Abreisedatum in ⚙️ setzen':d>0?(d===1?'Tag bis zur Abreise':'Tage bis zur Abreise'):d===0?'Heute geht es los!':'Reise läuft / vorbei'}
function nav(){$('nav').innerHTML=TABS.map(t=>`<button class="${t.k===tab?'on':''}" onclick="go('${t.k}')"><span>${t.e}</span>${t.n}</button>`).join('')}
function go(k){tab=k;render();scrollTo(0,0)}
function render(){head();nav();const t=TABS.find(x=>x.k===tab);$('main').innerHTML=tab==='home'?home():tab==='pack'?pack():tab==='exp'?exp():list(t)}

 if(S.people.length>1){const pp={};S.people.forEach(p=>pp[p]=0);E.forEach(e=>{const w=e.w&&e.w.length?e.w:S.people;w.forEach(p=>pp[p]=(pp[p]||0)+e.a/w.length)});const mx=Math.max(...Object.values(pp),1);

 S.flights.forEach(i=>{if(!i.date)return;const[a,b]=ap(i),u=(v,c)=>TZ[c]?utc(v,TZ[c]).toISOString().replace(/[-:]|\.\d+/g,''):dt(v),en=i.date2?u(i.date2,b):'';o+=`BEGIN:VEVENT\r\nUID:${i.id}@reise\r\nDTSTAMP:${z}\r\nDTSTART:${u(i.date,a)}\r\n${en?'DTEND:'+en+'\r\n':''}SUMMARY:✈️ ${e(i.title)}\r\nDESCRIPTION:${e('Buchung: '+i.ref+' '+i.note)}\r\nEND:VEVENT\r\n`});
