<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Reisebegleiter</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Reise">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0a84ff">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1d21;--mu:#6b7280;--ac:#0a84ff;--ln:#e5e7eb;--ok:#22a06b;--dg:#d93025;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f12;--card:#1a1c21;--tx:#f2f3f5;--mu:#9aa0a9;--ln:#2a2d34}}
:root[data-theme="dark"]{--bg:#0e0f12;--card:#1a1c21;--tx:#f2f3f5;--mu:#9aa0a9;--ln:#2a2d34}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding-bottom:84px}
header{padding:18px 16px 8px}
header h1{margin:0;font-size:24px}
.cd{margin-top:6px;color:var(--mu);font-size:14px}
.cd b{color:var(--ac)}
.hd{display:flex;gap:8px;margin-top:10px}
input,textarea,button{font:inherit;color:var(--tx)}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--card)}
main{padding:8px 16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:13px 14px;margin:10px 0}
.card h3{margin:0 0 4px;font-size:17px}
.card .m{color:var(--mu);font-size:14px}
.ref{display:inline-block;margin-top:6px;padding:3px 9px;border-radius:8px;background:var(--bg);font:600 14px ui-monospace,Menlo,monospace;letter-spacing:.5px}
.thumb{margin-top:8px;width:100%;max-height:160px;object-fit:cover;border-radius:10px;border:1px solid var(--ln)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:600}
.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}
.btn.d{background:var(--dg)}
.add{width:100%;margin-top:6px}
.empty{text-align:center;color:var(--mu);padding:36px 10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:9px 0 8px;font-size:11px;color:var(--mu)}
nav button span{display:block;font-size:22px}
nav button.on{color:var(--ac)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:5}
.sheet.show{display:flex}
.sheet>div{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.row{display:flex;gap:8px;margin-top:14px}.row .btn{flex:1}
.full{position:fixed;inset:0;background:#fff;z-index:9;display:none;align-items:center;justify-content:center}
.full.show{display:flex}.full img{max-width:100%;max-height:100%}
.full button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;background:#000;color:#fff;border:0;border-radius:20px;padding:8px 14px}
.pk{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--ln)}
.pk input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--ok)}
.pk.done span{text-decoration:line-through;color:var(--mu)}
.pk span{flex:1}.pk i{color:var(--mu);font-style:normal;padding:4px 8px}
.bar{height:8px;background:var(--ln);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar div{height:100%;background:var(--ok);width:0;transition:width .3s}
</style>
</head>
<body>
<header>
  <h1 id="tn">Meine Reise</h1>
  <div class="cd" id="cd"></div>
  <div class="hd"><button class="btn g" onclick="editTrip()">Reise bearbeiten</button></div>
</header>
<main id="main"></main>
<nav id="nav"></nav>

<div class="sheet" id="sheet"><div id="form"></div></div>
<div class="full" id="full"><button onclick="closeFull()">Schließen</button><img id="fimg" alt=""></div>

<script>
const TABS=[
 {k:'flights',n:'Flüge',e:'✈️',t:'Flug',f:{title:'Flug (z. B. EK 413 FRA → DXB)',date:'Abflug',date2:'Ankunft',ref:'Buchungscode',note:'Sitz, Gate, Terminal …'}},
 {k:'hotels',n:'Hotels',e:'🏨',t:'Hotel',f:{title:'Hotelname',date:'Check-in',date2:'Check-out',ref:'Buchungsnummer',note:'Adresse, Hinweise …'},dateOnly:true},
 {k:'visa',n:'Visa',e:'🛂',t:'Visum',f:{title:'Land / Visum-Art',date:'Gültig ab',date2:'Gültig bis',ref:'Antrags- / Visumsnummer',note:'Notizen'},dateOnly:true},
 {k:'pack',n:'Packliste',e:'🎒'}
];
const DEF=['Reisepass','Visum / ETA ausgedruckt','Flugtickets','Kreditkarte & Bargeld','Handy & Ladekabel','Powerbank','Reiseadapter','Medikamente','Kopfhörer','Sonnencreme','Zahnbürste & Hygiene','Kleidung für alle Tage','Auslandskrankenversicherung'];
let S;
try{S=JSON.parse(localStorage.getItem('reise')||'null')}catch(e){S=null}
S=S||{trip:{name:'Meine Reise',date:''},flights:[],hotels:[],visa:[],pack:[]};
let tab='flights';
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem('reise',JSON.stringify(S))}catch(e){alert('Speicher voll – bitte ein paar Fotos löschen oder kleinere verwenden.')}}
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function fmt(v,dateOnly){if(!v)return'';const d=new Date(v);if(isNaN(d))return v;return dateOnly?d.toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric'}):d.toLocaleString('de-DE',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}

function head(){
  $('tn').textContent=S.trip.name||'Meine Reise';
  const d=S.trip.date?Math.ceil((new Date(S.trip.date)-new Date().setHours(0,0,0,0))/864e5):null;
  $('cd').innerHTML=d===null?'Abreisedatum noch nicht gesetzt':d>0?'Noch <b>'+d+' Tage</b> bis zur Abreise':d===0?'<b>Heute geht es los!</b>':'Reise läuft / vorbei';
}
function nav(){
  $('nav').innerHTML=TABS.map(t=>`<button class="${t.k===tab?'on':''}" onclick="go('${t.k}')"><span>${t.e}</span>${t.n}</button>`).join('');
}
function go(k){tab=k;render()}
function render(){head();nav();const t=TABS.find(x=>x.k===tab);$('main').innerHTML=tab==='pack'?renderPack():renderList(t)}

function renderList(t){
  const L=S[t.k];
  let h=L.length?'':`<div class="empty">Noch keine Einträge.<br>Füge deinen ersten ${t.t} hinzu.</div>`;
  L.forEach(i=>{
    h+=`<div class="card" onclick="openForm('${t.k}','${i.id}')"><h3>${esc(i.title)}</h3>
    <div class="m">${i.date?fmt(i.date,t.dateOnly):''}${i.date2?' → '+fmt(i.date2,t.dateOnly):''}</div>
    ${i.note?`<div class="m">${esc(i.note)}</div>`:''}
    ${i.ref?`<div class="ref">${esc(i.ref)}</div>`:''}
    ${i.img?`<img class="thumb" src="${i.img}" alt="Dokument" onclick="event.stopPropagation();showFull('${t.k}','${i.id}')">`:''}</div>`;
  });
  return h+`<button class="btn add" onclick="openForm('${t.k}')">+ ${t.t} hinzufügen</button>`;
}
function renderPack(){
  const L=S.pack,n=L.filter(x=>x.d).length,p=L.length?Math.round(n/L.length*100):0;
  let h=`<div class="card"><b>${n} von ${L.length} gepackt</b><div class="bar"><div style="width:${p}%"></div></div></div>
  <div style="display:flex;gap:8px"><input id="pi" placeholder="Neuer Gegenstand" onkeydown="if(event.key==='Enter')addPack()"><button class="btn" onclick="addPack()">+</button></div>
  <div class="card" style="padding:4px 12px">`;
  if(!L.length)h+='<div class="empty">Packliste ist leer.</div>';
  L.forEach(i=>{h+=`<div class="pk ${i.d?'done':''}"><input type="checkbox" ${i.d?'checked':''} onchange="tog('${i.id}')"><span>${esc(i.t)}</span><i onclick="delPack('${i.id}')">✕</i></div>`});
  h+='</div><div class="row">';
  if(!L.length)h+='<button class="btn g" onclick="loadDef()">Vorschlag laden</button>';
  else h+='<button class="btn g" onclick="resetPack()">Alles abhaken zurücksetzen</button>';
  return h+'</div>';
}
function addPack(){const v=$('pi').value.trim();if(!v)return;S.pack.push({id:uid(),t:v,d:false});save();render();setTimeout(()=>$('pi')&&$('pi').focus(),0)}
function tog(id){const x=S.pack.find(i=>i.id===id);x.d=!x.d;save();render()}
function delPack(id){S.pack=S.pack.filter(i=>i.id!==id);save();render()}
function loadDef(){DEF.forEach(t=>S.pack.push({id:uid(),t,d:false}));save();render()}
function resetPack(){S.pack.forEach(i=>i.d=false);save();render()}

let cur=null,curImg='';
function openForm(k,id){
  const t=TABS.find(x=>x.k===k),it=id?S[k].find(i=>i.id===id):{};
  cur={k,id};curImg=it.img||'';
  const ty=t.dateOnly?'date':'datetime-local';
  $('form').innerHTML=`<h2 style="margin:0">${id?t.t+' bearbeiten':t.t+' hinzufügen'}</h2>
  <label>${t.f.title}</label><input id="f_title" value="${esc(it.title)}">
  <label>${t.f.date}</label><input id="f_date" type="${ty}" value="${esc(it.date)}">
  <label>${t.f.date2}</label><input id="f_date2" type="${ty}" value="${esc(it.date2)}">
  <label>${t.f.ref}</label><input id="f_ref" value="${esc(it.ref)}" autocapitalize="characters">
  <label>${t.f.note}</label><textarea id="f_note" rows="2">${esc(it.note)}</textarea>
  <label>Ticket / Bestätigung als Foto oder Screenshot (offline griffbereit)</label>
  <input type="file" accept="image/*" onchange="pickImg(this)">
  <div id="pv">${curImg?`<img class="thumb" src="${curImg}" alt="">`:''}</div>
  <div class="row"><button class="btn g" onclick="closeForm()">Abbrechen</button><button class="btn" onclick="saveForm()">Speichern</button></div>
  ${id?'<div class="row"><button class="btn d" onclick="delItem()">Löschen</button></div>':''}`;
  $('sheet').classList.add('show');
}
function closeForm(){$('sheet').classList.remove('show')}
function pickImg(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const m=1100,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    curImg=c.toDataURL('image/jpeg',.75);$('pv').innerHTML=`<img class="thumb" src="${curImg}" alt="">`};im.src=r.result};
  r.readAsDataURL(f);
}
function saveForm(){
  const o={title:$('f_title').value.trim(),date:$('f_date').value,date2:$('f_date2').value,ref:$('f_ref').value.trim(),note:$('f_note').value.trim(),img:curImg};
  if(!o.title){alert('Bitte einen Titel eingeben.');return}
  const L=S[cur.k];
  if(cur.id){Object.assign(L.find(i=>i.id===cur.id),o)}else{L.push({id:uid(),...o})}
  L.sort((a,b)=>(a.date||'9').localeCompare(b.date||'9'));
  save();closeForm();render();
}
function delItem(){if(!confirm('Wirklich löschen?'))return;S[cur.k]=S[cur.k].filter(i=>i.id!==cur.id);save();closeForm();render()}
function showFull(k,id){$('fimg').src=S[k].find(i=>i.id===id).img;$('full').classList.add('show')}
function closeFull(){$('full').classList.remove('show')}
function editTrip(){
  $('form').innerHTML=`<h2 style="margin:0">Reise</h2>
  <label>Name der Reise</label><input id="t_n" value="${esc(S.trip.name)}">
  <label>Abreisedatum</label><input id="t_d" type="date" value="${esc(S.trip.date)}">
  <div class="row"><button class="btn g" onclick="closeForm()">Abbrechen</button><button class="btn" onclick="saveTrip()">Speichern</button></div>`;
  $('sheet').classList.add('show');
}
function saveTrip(){S.trip.name=$('t_n').value.trim()||'Meine Reise';S.trip.date=$('t_d').value;save();closeForm();render()}
render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
